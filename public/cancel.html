<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancel subscription — Fermata Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f1;--panel:#fffefb;--ink:#17150f;--muted:#6b6557;--line:#e2ddd2;--accent:#1c5d4a;--accent-soft:#e6f0ea;--danger:#8c2f22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12110f;--panel:#1a1917;--ink:#f0ece3;--muted:#9a9384;--line:#2c2a26;--accent:#6fd3ad;--accent-soft:#16302a;--danger:#f09384}}
:root[data-theme="dark"]{--bg:#12110f;--panel:#1a1917;--ink:#f0ece3;--muted:#9a9384;--line:#2c2a26;--accent:#6fd3ad;--accent-soft:#16302a;--danger:#f09384}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px 80px}
.brand{font-family:'Instrument Serif',Georgia,serif;font-size:26px;margin-bottom:28px}
.brand em{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:31px;line-height:1.15;margin:0 0 8px}
.sub{color:var(--muted);font-size:14.5px;margin-bottom:20px}
.plan{font:400 12.5px 'JetBrains Mono',monospace;color:var(--muted);padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:20px;word-break:break-all}
label{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px}
textarea{width:100%;min-height:96px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.chip{font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:var(--panel);border:0;padding:12px 20px;border-radius:9px;font:600 15px Inter,sans-serif;cursor:pointer;width:100%}
button.primary:disabled{opacity:.5;cursor:not-allowed}
button.quiet{background:transparent;border:0;color:var(--muted);font:500 14px Inter,sans-serif;cursor:pointer;text-decoration:underline;margin-top:14px;width:100%;padding:8px}
button.quiet:hover{color:var(--danger)}
.offer{border-left:3px solid var(--accent);padding-left:16px;margin:4px 0 22px}
.offer p{margin:8px 0 0;color:var(--ink)}
.note{font-size:13.5px;color:var(--muted);margin-top:16px}
.err{color:var(--danger)}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:var(--accent)}
.foot{margin-top:22px;font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Fer<em>mata</em> Studio</div>
  <div class="card" id="card"><span class="spinner"></span> Loading your subscription…</div>
  <div class="foot">This is the subscriber's side of the demo. <a href="/">Open the retention desk</a> to watch it arrive.</div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SID = new URLSearchParams(location.search).get('s');
const SAMPLES = [
  "Money's really tight this month.",
  "I'm not using it enough to justify the price.",
  "It isn't the right tool for me — I've moved on.",
  "Travelling for a few months, won't need it.",
];
let ME = null, VERDICT = null;

async function api(path, body){
  const r = await fetch(path, body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {});
  const j = await r.json();
  if(!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

function planLine(){
  return `${esc(ME.planName)} · $${ME.price.toFixed(2)}/month · ${esc(ME.status)}<br>PayPal subscription ${esc(ME.id)}`;
}

function showForm(){
  $('#card').innerHTML = `
    <h1>Cancel your subscription</h1>
    <div class="sub">Hi ${esc(ME.first)}. Sorry to see you go.</div>
    <div class="plan">${planLine()}</div>
    <label for="why">Before you go, what's the reason?</label>
    <textarea id="why" placeholder="A sentence is plenty."></textarea>
    <div class="chips">${SAMPLES.map((s,i)=>`<button class="chip" data-i="${i}">${esc(s)}</button>`).join('')}</div>
    <button class="primary" id="go">Continue</button>
    <div id="msg"></div>`;
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { $('#why').value = SAMPLES[c.dataset.i]; });
  $('#go').onclick = decide;
}

async function decide(){
  const text = $('#why').value.trim();
  if(!text){ $('#why').focus(); return; }
  $('#go').disabled = true;
  $('#msg').innerHTML = `<div class="note"><span class="spinner"></span> One moment…</div>`;
  try{
    const { verdict } = await api('/api/decide', { subscriptionId: SID, text, source: 'subscriber' });
    VERDICT = verdict; showOffer();
  }catch(e){ $('#msg').innerHTML = `<div class="note err">${esc(e.message)}</div>`; $('#go').disabled = false; }
}

const OFFER = {
  pause:     { title: 'Pause instead?',            cta: 'Pause my subscription' },
  downgrade: { title: 'Switch to a smaller plan?', cta: 'Switch plan' },
  resume:    { title: 'Pick it back up?',          cta: 'Resume my subscription' },
  release:   { title: "Understood — we'll let you go.", cta: null },
  escalate:  { title: 'A person will take this from here.', cta: null },
};

function showOffer(){
  const o = OFFER[VERDICT.chosen_action] || OFFER.escalate;
  const sub = VERDICT.chosen_action === 'downgrade' && VERDICT.plan ? `<div class="sub" style="margin:6px 0 0">${esc(VERDICT.plan.label)}</div>` : '';
  $('#card').innerHTML = `
    <div class="offer"><h1>${esc(o.title)}</h1>${sub}<p>${esc(VERDICT.message_to_subscriber)}</p></div>
    ${o.cta ? `<button class="primary" id="accept">${esc(o.cta)}</button>` : ''}
    ${VERDICT.chosen_action === 'release'
        ? `<button class="primary" id="leave">Cancel my subscription</button>`
        : `<button class="quiet" id="leave">No thanks — cancel anyway</button>`}
    <div id="msg"></div>`;
  if(o.cta) $('#accept').onclick = accept;
  $('#leave').onclick = leave;
}

async function accept(){
  $('#accept').disabled = true;
  $('#msg').innerHTML = `<div class="note"><span class="spinner"></span> Updating your subscription with PayPal…</div>`;
  try{
    const { receipt } = await api('/api/execute', { subscriptionId: SID, verdictId: VERDICT.verdictId });
    if(receipt.requiresConsent){
      done('One more step', `PayPal needs you to approve the plan change yourself. <a href="${esc(receipt.consentLink)}" target="_blank" rel="noopener">Approve it at PayPal</a>.`);
    } else if(receipt.statusAfter === 'SUSPENDED'){
      done('Paused.', 'You won\'t be charged until you choose to resume. Nothing has been deleted.');
    } else if(receipt.statusAfter === 'ACTIVE'){
      done('Welcome back.', 'Your subscription is active again.');
    } else {
      done('Done.', `Your subscription is now ${esc(receipt.statusAfter)}.`);
    }
  }catch(e){ $('#msg').innerHTML = `<div class="note">${esc(e.message)}</div>`; }
}

async function leave(){
  $('#msg').innerHTML = `<div class="note"><span class="spinner"></span> Processing…</div>`;
  try{
    const r = await api('/api/cancel-anyway', { subscriptionId: SID, verdictId: VERDICT && VERDICT.verdictId });
    if(r.executed) done('Cancelled.', 'Your subscription has ended. Thanks for the time you spent with us.');
    else done('Cancellation recorded.', esc(r.note));
  }catch(e){ $('#msg').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}

function done(title, html){
  $('#card').innerHTML = `<h1>${esc(title)}</h1><p class="sub" style="margin-top:10px">${html}</p>
    <div class="note"><a href="/">See this on the retention desk →</a></div>`;
}

(async () => {
  try{
    const st = await api('/api/state');
    const s = st.subscriptions.find(x => x.id === SID);
    if(!s){ $('#card').innerHTML = `<h1>No such subscription</h1><p class="sub">Open this page from a subscriber's link on the <a href="/">retention desk</a>.</p>`; return; }
    const plan = st.plans.find(p => p.id === s.plan_id) || { name: 'Plan', price: 0 };
    const person = st.people[SID] || { name: 'there' };
    ME = { id: s.id, status: s.status, planName: plan.name, price: plan.price, first: person.name.split(' ')[0] };
    showForm();
  }catch(e){ $('#card').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
